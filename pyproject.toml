[project]
name = "jieba_pyfast"
version = "4.0.1"
description = "Tokenize Chinese characters"
license = "MIT"
authors = [{ name = "snapADDY GmbH", email = "info@snapaddy.com" }]
readme = "README.md"
requires-python = ">=3.11"

[dependency-groups]
dev = ["pytest>=8", "cibuildwheel>=2.22"]

[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-* cp314-* cp315-*"
before-build = "python -c \"import shutil; shutil.rmtree('build', ignore_errors=True)\""
test-requires = "pytest"
test-command = "pytest {project}/tests"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
